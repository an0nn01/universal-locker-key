name: Build FAP

on:
  workflow_dispatch:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3
      with:
        submodules: 'recursive'

    - name: Build FAP
      uses: flipperdevices/flipperzero-ide-action@v2
      with:
        app: ${{ github.event.repository.name }}
        target: f7
